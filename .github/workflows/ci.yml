name: ci

on:
  push:
  pull_request:

jobs:
  check:
    name: Lints and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: extractions/setup-just@v2
      - run: npm --prefix web ci
      - run: just lint
      - run: just test
      - name: Generated TypeScript types match the Rust ones
        run: just types && git diff --exit-code web/src/gen && test -z "$(git status --porcelain web/src/gen)"

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-analyzer, rust-src
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: extractions/setup-just@v2
      - uses: cachix/install-nix-action@v31
      - name: Tools the review uses
        run: |
          # difftastic for structural diffs; language servers for every language the demo has.
          nix profile install nixpkgs#difftastic nixpkgs#nil
          go install golang.org/x/tools/gopls@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          npm install -g typescript@5 typescript-language-server pyright yaml-language-server
      - run: npm --prefix web ci
      - run: cd web && npx playwright install --with-deps chromium
      - run: just e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: target/e2e-shots

  nix:
    name: Nix package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build -L
      - run: ./result/bin/diffd --version && ./result/bin/diffd config | head -5
