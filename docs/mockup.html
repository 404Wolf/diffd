<title>diffd Review Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* One token set, named the way the Tailwind theme will name them. */
:root {
  --page: #e4e4e7; --bg: #ffffff; --panel: #fafafa; --inset: #f4f4f5; --hover: #efeff1;
  --line: #e4e4e7; --line-strong: #d4d4d8;
  --fg: #18181b; --muted: #52525b; --subtle: #a1a1aa;
  --accent: #4f46e5; --accent-fg: #ffffff; --accent-soft: #eef2ff; --accent-line: #c7d2fe;
  --cursor: rgba(79, 70, 229, 0.07); --visual: rgba(79, 70, 229, 0.14);
  --add: #15803d; --add-bg: #dcfce7; --add-gutter: #f0fdf4; --add-mark: #4ade80;
  --del: #b91c1c; --del-bg: #fee2e2; --del-gutter: #fef2f2; --del-mark: #f87171;
  --mod-mark: #facc15; --warn: #b45309; --live: #16a34a;
  --syn-keyword: #7e22ce; --syn-string: #0369a1; --syn-comment: #a1a1aa; --syn-constant: #0e7490;
  --syn-function: #1d4ed8; --syn-type: #a16207; --syn-attr: #64748b; --syn-tag: #0f766e;
  --shadow: 0 1px 2px rgba(24, 24, 27, 0.06), 0 10px 28px rgba(24, 24, 27, 0.13);
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #000000; --bg: #0c0c0e; --panel: #111114; --inset: #161619; --hover: #1d1d21;
    --line: #26262b; --line-strong: #34343a;
    --fg: #f4f4f5; --muted: #a1a1aa; --subtle: #63636b;
    --accent: #818cf8; --accent-fg: #0c0c1a; --accent-soft: rgba(129, 140, 248, 0.13); --accent-line: rgba(129, 140, 248, 0.35);
    --cursor: rgba(129, 140, 248, 0.08); --visual: rgba(129, 140, 248, 0.16);
    --add: #4ade80; --add-bg: rgba(74, 222, 128, 0.15); --add-gutter: rgba(74, 222, 128, 0.05); --add-mark: #16a34a;
    --del: #f87171; --del-bg: rgba(248, 113, 113, 0.16); --del-gutter: rgba(248, 113, 113, 0.05); --del-mark: #dc2626;
    --mod-mark: #ca8a04; --warn: #fbbf24; --live: #4ade80;
    --syn-keyword: #c084fc; --syn-string: #7dd3fc; --syn-comment: #6b6b74; --syn-constant: #67e8f9;
    --syn-function: #93c5fd; --syn-type: #fcd34d; --syn-attr: #94a3b8; --syn-tag: #5eead4;
    --shadow: 0 0 0 1px rgba(255, 255, 255, 0.05), 0 12px 32px rgba(0, 0, 0, 0.6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #000000; --bg: #0c0c0e; --panel: #111114; --inset: #161619; --hover: #1d1d21;
  --line: #26262b; --line-strong: #34343a;
  --fg: #f4f4f5; --muted: #a1a1aa; --subtle: #63636b;
  --accent: #818cf8; --accent-fg: #0c0c1a; --accent-soft: rgba(129, 140, 248, 0.13); --accent-line: rgba(129, 140, 248, 0.35);
  --cursor: rgba(129, 140, 248, 0.08); --visual: rgba(129, 140, 248, 0.16);
  --add: #4ade80; --add-bg: rgba(74, 222, 128, 0.15); --add-gutter: rgba(74, 222, 128, 0.05); --add-mark: #16a34a;
  --del: #f87171; --del-bg: rgba(248, 113, 113, 0.16); --del-gutter: rgba(248, 113, 113, 0.05); --del-mark: #dc2626;
  --mod-mark: #ca8a04; --warn: #fbbf24; --live: #4ade80;
  --syn-keyword: #c084fc; --syn-string: #7dd3fc; --syn-comment: #6b6b74; --syn-constant: #67e8f9;
  --syn-function: #93c5fd; --syn-type: #fcd34d; --syn-attr: #94a3b8; --syn-tag: #5eead4;
  --shadow: 0 0 0 1px rgba(255, 255, 255, 0.05), 0 12px 32px rgba(0, 0, 0, 0.6);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--page); color: var(--fg); font: 13px/1.45 var(--font-ui); padding-inline: 16px; padding-block: 10px; display: flex; flex-direction: column; gap: 8px; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
kbd { font: 500 10.5px/1 var(--font-code); padding: 2px 4px; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; background: var(--bg); color: var(--muted); white-space: nowrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--bg); color: var(--fg); cursor: pointer; font-size: 12px; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--hover); color: var(--fg); }

.demo { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 12.5px; color: var(--muted); }
.demo strong { color: var(--fg); font-weight: 600; }
.demo .spacer { flex: 1; }

.app { flex: 1; min-height: 580px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--bg); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }

/* Top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 7px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { display: flex; align-items: center; gap: 6px; font: 600 12.5px var(--font-code); }
.brand i { width: 8px; height: 8px; border-radius: 2px; background: var(--accent); transform: rotate(45deg); }
.title { font-weight: 600; font-size: 13.5px; min-width: 0; }
.revs { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
.rev { font: 11.5px var(--font-code); padding: 1px 6px; border-radius: 4px; background: var(--inset); border: 1px solid var(--line); color: var(--fg); }
.stats { display: flex; gap: 8px; font: 11.5px var(--font-code); font-variant-numeric: tabular-nums; color: var(--muted); }
.a { color: var(--add); } .d { color: var(--del); }
.grow { flex: 1; }
.presence { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); font-size: 12px; font-weight: 500; white-space: nowrap; }
.presence .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 3px color-mix(in srgb, var(--live) 20%, transparent); }
.presence[data-state="working"] .dot { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 22%, transparent); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.35; } }

/* Columns: tree drawer · (multibuffer over chat) · activity drawer */
.main { position: relative; min-height: 0; display: grid; grid-template-columns: var(--lw, 240px) minmax(0, 1fr) var(--rw, 240px); }
.drawer { position: relative; min-width: 0; min-height: 0; display: flex; background: var(--panel); }
.drawer.left { grid-column: 1; border-right: 1px solid var(--line); }
.drawer.right { grid-column: 3; border-left: 1px solid var(--line); flex-direction: row-reverse; }
.drawer-body { flex: 1; min-width: 0; overflow: auto; }
.drawer.closed .drawer-body { display: none; }
.handle { flex: none; width: 7px; cursor: col-resize; position: relative; touch-action: none; z-index: 4; }
.drawer.left .handle { margin-right: -4px; }
.drawer.right .handle { margin-left: -4px; }
.handle::after { content: ""; position: absolute; top: 0; bottom: 0; left: 3px; width: 2px; background: transparent; transition: background 0.12s; }
.handle:hover::after, .handle.dragging::after { background: var(--accent); }
.drawer.closed .handle { width: 11px; margin: 0; cursor: pointer; }
.drawer.closed .handle::after { display: none; }
.drawer.closed .handle::before { content: ""; position: absolute; top: 50%; left: 4px; width: 3px; height: 32px; margin-top: -16px; border-radius: 3px; background: var(--line-strong); }
.drawer.closed .handle:hover::before { background: var(--accent); }
.drawer.closed .handle .badge { position: absolute; top: 8px; left: 1px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
.center { grid-column: 2; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.buffer { flex: 1; min-height: 0; overflow: auto; background: var(--inset); overscroll-behavior: contain; padding-bottom: 24px; }

/* Tree */
.pane-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 6px; padding: 8px 8px 6px 10px; background: var(--panel); font-size: 10.5px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.pane-head .n { font-weight: 500; letter-spacing: 0; color: var(--subtle); }
.filter { display: block; width: calc(100% - 16px); margin: 0 8px 6px; height: 24px; padding: 0 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); font-size: 12px; }
.tree ul { list-style: none; margin: 0; padding: 0; }
.tree ul ul { margin-left: 10px; padding-left: 3px; border-left: 1px solid var(--line); }
.tree > ul { padding: 0 6px 10px; }
.t-row { display: flex; align-items: center; gap: 5px; height: 22px; padding: 0 6px 0 3px; border-radius: 4px; font-size: 12.5px; cursor: pointer; user-select: none; white-space: nowrap; }
.t-row:hover { background: var(--hover); }
.t-dir { color: var(--muted); }
.t-dir .chev { width: 12px; flex: none; font-size: 8px; color: var(--subtle); text-align: center; transition: transform 0.1s; }
.t-dir[aria-expanded="false"] .chev { transform: rotate(-90deg); }
.t-file .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.t-file[aria-current="true"] { background: var(--accent-soft); }
.t-file.dim .name { color: var(--subtle); }
.st { flex: none; width: 12px; text-align: center; font: 600 10px var(--font-code); }
.st[data-s="M"] { color: var(--warn); } .st[data-s="A"] { color: var(--add); } .st[data-s="D"] { color: var(--del); }
.t-meta { display: flex; align-items: center; gap: 6px; color: var(--subtle); font: 10.5px var(--font-code); }
.t-meta .c { display: inline-flex; align-items: center; gap: 2px; }
.t-meta .c.unread { color: var(--accent); font-weight: 600; }
.bar { display: inline-flex; gap: 1px; }
.bar i { width: 5px; height: 5px; border-radius: 1px; background: var(--line-strong); }
.bar i.a { background: var(--add); } .bar i.d { background: var(--del); }
.dotu { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

/* Multibuffer */
.summary { margin: 10px 10px 2px; padding: 8px 12px; border: 1px solid var(--accent-line); border-radius: 6px; background: var(--bg); font-size: 12.5px; }
.summary b { color: var(--accent); font-weight: 600; }
.summary p { margin: 2px 0 0; max-width: 90ch; }
.md code { font: 11.5px var(--font-code); background: var(--inset); padding: 0 4px; border-radius: 3px; }
.file { margin: 8px 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--bg); overflow: clip; }
.file-head { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; background: var(--panel); border-bottom: 1px solid var(--line); font-size: 12px; }
.file.collapsed .file-head { border-bottom: 0; }
.fold { width: 18px; height: 18px; border: 0; border-radius: 4px; background: transparent; color: var(--subtle); cursor: pointer; font-size: 9px; }
.fold:hover { background: var(--hover); color: var(--fg); }
.file.collapsed .fold { transform: rotate(-90deg); }
.path { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 500 12px var(--font-code); }
.path .dir { color: var(--muted); font-weight: 400; }
.chip { font-size: 11px; color: var(--muted); padding: 1px 6px; border-radius: 4px; background: var(--inset); white-space: nowrap; }
.chip.agent { color: var(--accent); background: var(--accent-soft); }
.viewed-box { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--muted); cursor: pointer; }
.file-note { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 7px 12px; font-size: 12px; color: var(--muted); background: var(--panel); }

/* Rows: difftastic side by side. Only novel tokens are colored. */
.rows { font: 12px/18px var(--font-code); font-variant-ligatures: none; tab-size: 4; --cols: 42px minmax(0, 1fr) 42px minmax(0, 1fr); }
.row { position: relative; display: grid; grid-template-columns: var(--cols); min-height: 18px; scroll-margin-top: 40px; scroll-margin-bottom: 20px; }
.num { position: relative; padding-right: 8px; text-align: right; color: var(--subtle); font-size: 11px; user-select: none; -webkit-user-select: none; cursor: pointer; }
.num::before { content: attr(data-n); }
.num.side-new { border-left: 1px solid var(--line); }
.num.del { color: var(--del); background: var(--del-gutter); font-weight: 600; }
.num.add { color: var(--add); background: var(--add-gutter); font-weight: 600; }
.code { min-width: 0; padding: 0 10px 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; cursor: text; }
.code.empty, .num.empty { background: repeating-linear-gradient(135deg, transparent 0 5px, color-mix(in srgb, var(--line) 55%, transparent) 5px 6px); cursor: default; }
.x-k { color: var(--syn-keyword); } .x-s { color: var(--syn-string); } .x-c { color: var(--syn-comment); font-style: italic; }
.x-n { color: var(--syn-constant); } .x-f { color: var(--syn-function); } .x-t { color: var(--syn-type); }
.x-a { color: var(--syn-attr); } .x-g { color: var(--syn-tag); }
.nv-add, .nv-del { font-weight: 600; border-radius: 2px; font-style: normal; }
.nv-add { color: var(--add) !important; background: var(--add-bg); }
.nv-del { color: var(--del) !important; background: var(--del-bg); }
.wc { outline: 1.5px solid var(--accent); outline-offset: 0; border-radius: 2px; background: var(--accent-soft); }
body.sym .ref { text-decoration: underline dotted var(--accent); text-underline-offset: 3px; cursor: pointer; }
.row.cur::after, .row.vsel::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
.row.cur::after { background: var(--cursor); }
.row.vsel::after { background: var(--visual); }
.row.cur .code.caret { box-shadow: inset 2px 0 0 var(--accent); }
.num.noted::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); }
.num.since { box-shadow: inset -2px 0 0 var(--warn); }
.row.flash .code:not(.empty) { animation: flash 1.8s ease-out; }
@keyframes flash { from { background-color: color-mix(in srgb, var(--accent) 22%, transparent); } }
.gap { display: flex; align-items: center; gap: 2px; height: 22px; padding: 0 6px; background: var(--panel); border-block: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }
.gap button { border: 0; background: transparent; color: var(--accent); font-size: 11.5px; font-weight: 500; padding: 1px 6px; border-radius: 4px; cursor: pointer; }
.gap button:hover { background: var(--accent-soft); }
.gap .ctx { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 6px; font: 11px var(--font-code); color: var(--subtle); }
.gap-body[hidden] { display: none !important; }
@supports (content-visibility: hidden) { .gap-body[hidden="until-found"] { display: block !important; content-visibility: hidden; } }

/* File view (g enter): the plain file with slight change marks */
.fv .row { grid-template-columns: 6px 46px minmax(0, 1fr); }
.mark { position: relative; }
.mark.add { background: var(--add-mark); }
.mark.mod { background: var(--mod-mark); }
.mark.del::after { content: ""; position: absolute; left: 0; top: -4px; border: 4px solid transparent; border-left: 5px solid var(--del-mark); }
.fv-banner { display: flex; align-items: center; gap: 8px; margin: 10px 10px 0; padding: 6px 10px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line-strong); font-size: 12px; color: var(--muted); }
.fv-banner b { color: var(--fg); font-weight: 600; }
.legend { display: inline-flex; align-items: center; gap: 4px; }
.legend i { width: 4px; height: 12px; border-radius: 1px; }

/* Threads and notes, inline under the code they belong to */
.inline { display: grid; grid-template-columns: var(--cols); padding-block: 6px; background: var(--inset); border-block: 1px solid var(--line); }
.inline > .card { grid-column: 4 / 5; margin-right: 10px; }
.inline[data-side="old"] > .card { grid-column: 2 / 3; }
.card { max-width: 720px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--bg); font: 12.5px/1.5 var(--font-ui); overflow: hidden; scroll-margin-top: 44px; }
.card.note { border-color: var(--accent-line); }
.card.focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.card.resolved { opacity: 0.7; }
.card-top { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 5px 10px 0; font-size: 11.5px; color: var(--muted); }
.card-top .where { font: 11px var(--font-code); }
.kind { font: 600 10px/1 var(--font-ui); letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent); }
.kind[data-kind="risk"] { color: var(--del); }
.card-top .n { margin-left: auto; font-variant-numeric: tabular-nums; }
.msg { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 0 8px; padding: 6px 10px; }
.msg + .msg { border-top: 1px solid var(--line); }
.av { grid-row: span 2; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font: 600 10px var(--font-ui); background: var(--inset); color: var(--muted); }
.av.agent { background: var(--accent-soft); color: var(--accent); }
.msg-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; font-size: 12px; }
.msg-head b { font-weight: 600; }
.when { color: var(--subtle); font-size: 11px; }
.msg-body { margin: 0; max-width: 72ch; }
.delivery { font-size: 10.5px; font-weight: 500; color: var(--subtle); }
.delivery[data-state="seen"], .delivery[data-state="replied"] { color: var(--accent); }
.changed-since { padding: 4px 10px; font-size: 11.5px; color: var(--warn); background: color-mix(in srgb, var(--warn) 8%, transparent); border-bottom: 1px solid var(--line); }
.card-foot { display: flex; gap: 2px; padding: 3px 6px; border-top: 1px solid var(--line); }
.link { border: 0; background: transparent; color: var(--muted); font-size: 11.5px; padding: 2px 6px; border-radius: 4px; cursor: pointer; }
.link:hover { background: var(--hover); color: var(--fg); }

/* Floating comment popover, anchored where you selected */
.pop { position: absolute; z-index: 20; width: min(400px, calc(100% - 20px)); padding: 8px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--bg); box-shadow: var(--shadow); font-size: 12px; }
.pop .pop-head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; color: var(--muted); }
.pop .pop-head .where { font: 11px var(--font-code); color: var(--fg); }
.pop pre { margin: 0 0 6px; max-height: 58px; overflow: hidden; padding: 4px 6px; border-radius: 4px; background: var(--inset); font: 11px/1.45 var(--font-code); color: var(--muted); white-space: pre-wrap; }
.pop textarea { display: block; width: 100%; min-height: 64px; resize: vertical; padding: 6px 8px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--bg); font-size: 12.5px; line-height: 1.45; }
.pop textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.pop .pop-foot { display: flex; align-items: center; gap: 6px; margin-top: 6px; color: var(--subtle); font-size: 11px; }
.pop .pop-foot .spacer { flex: 1; }
.bubble { position: absolute; z-index: 20; }
.bubble button { box-shadow: var(--shadow); }

/* Chat with the agent, docked under the diff */
.chat { flex: none; border-top: 1px solid var(--line); background: var(--panel); }
.chat-log { max-height: 190px; overflow: auto; padding: 6px 12px 0; display: flex; flex-direction: column; gap: 6px; }
.chat-log[hidden] { display: none !important; }
.cm { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 8px; font-size: 12.5px; }
.cm p { margin: 1px 0 0; max-width: 90ch; }
.cm a { color: var(--accent); font: 11.5px var(--font-code); cursor: pointer; text-decoration: none; border-bottom: 1px solid var(--accent-line); }
.chat-input { display: flex; align-items: center; gap: 8px; padding: 6px 10px; }
.chat-input input { flex: 1; min-width: 0; height: 28px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--bg); font-size: 12.5px; }
.chat-input input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.chat-input .hint { font-size: 11px; color: var(--subtle); white-space: nowrap; }

/* Activity */
.act-list { list-style: none; margin: 0; padding: 0 6px 10px; display: flex; flex-direction: column; gap: 1px; }
.act { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 0 7px; padding: 5px 6px; border-radius: 5px; cursor: pointer; font-size: 12px; }
.act:hover { background: var(--hover); }

  const toks = [];

  scan: while (i < text.length) {

      const m = re.exec(text);
      if (m && m[0].length) { toks.push([i, i + m[0].length, cls]); i += m[0].length; continue scan; }
    }
    WORD.lastIndex = i;
    i += WORD.exec(text)[0].length;
  }
  return toks;
}

  if (!text) return [];
  if (novel === undefined) { const a = text.search(/\S/); return a < 0 ? [] : [[a, text.length]]; }
  return novel.map((s) => [text.indexOf(s), text.indexOf(s) + s.length]).filter(([a]) => a >= 0);

    const a = pts[p], b = pts[p + 1];
    const tok = toks.find((t) => a >= t[0] && b <= t[1]);
    const cls = [tok && "x-" + tok[2], inside(nv, a, b) && /\S/.test(text.slice(a, b)) && nvClass, inside(refs, a, b) && "ref", word && inside([word], a, b) && "wc"].filter(Boolean);
    html += cls.length ? `<span class="${cls.join(" ")}">${esc(text.slice(a, b))}</span>` : esc(text.slice(a, b));
  }
  return html;
}

/* Definitions, GitHub-style: diffd extracts them with tree-sitter tags queries. */
const DEF_RES = [/\bpub const ([A-Z_][A-Z0-9_]*)/, /\bstruct ([A-Za-z_]\w*)/, /\bfn ([a-z_]\w*)/, /\bfunction ([A-Za-z_]\w*)/, /\bexport type ([A-Za-z_]\w*)/, /^const ([A-Z_]\w*) =/, /CREATE INDEX (\w+)/];
let DEF_NAMES = new Set();
function symbols() {
  const out = [];
  state.files.forEach((f, fi) => f.rows.forEach((r) => {
    for (const [side, text, line] of [["new", r.n, r.nl], ["old", r.k === "del" ? r.o : null, r.ol]]) {
      if (!text) continue;
      for (const re of DEF_RES) { const m = re.exec(text); if (m) out.push({ name: m[1], file: fi, side, line, text: text.trim() }); }
    }
  }));
  return out;
}

/* ---------------------------------------------------------------------------
 * State
 * ------------------------------------------------------------------------- */
const CONTEXT = 3, STEP = 5;
let state;
const changed = (r) => r.k !== "same";

function initState() {
  const files = structuredClone(FILES);
  for (const f of files) {
    let o = 0, n = 0;
    for (const r of f.rows) { r.ol = r.o === null ? null : ++o; r.nl = r.n === null ? null : ++n; }
  }
  state = {
    files, notes: structuredClone(NOTES), threads: structuredClone(THREADS), activity: structuredClone(ACTIVITY), chat: structuredClone(CHAT),
    revision: 2, cursor: { key: null, side: "new", word: null }, visual: null, mode: "diff", fileView: null,
    composer: null, noteIdx: -1, jumps: [], jumpAt: 0, pending: [], count: "", message: "", currentFile: 0,
    closedDirs: new Set(), filter: "", nudge: null, selection: null, played: false, nextId: 3,
  };
  DEF_NAMES = new Set(symbols().map((s) => s.name));
  state.fs = files.map((f, fi) => ({ visible: initialVisible(f, fi), collapsed: Boolean(f.collapsedBy), viewed: false, since: new Set() }));
}

function initialVisible(f, fi) {
  const vis = f.rows.map(() => false);
  f.rows.forEach((r, i) => {
    if (!changed(r)) return;
    for (let j = Math.max(0, i - CONTEXT); j <= Math.min(f.rows.length - 1, i + CONTEXT); j++) vis[j] = true;
  });
  for (const a of [...state.notes, ...state.threads].filter((x) => x.file === fi)) {
    f.rows.forEach((r, i) => { const ln = a.side === "old" ? r.ol : r.nl; if (ln !== null && ln >= a.lines[0] && ln <= a.lines[1]) vis[i] = true; });
  }
  return vis;
}

const fileStats = (f) => ({ add: f.rows.filter((r) => changed(r) && r.n !== null).length, del: f.rows.filter((r) => changed(r) && r.o !== null).length });
const baseName = (p) => p.slice(p.lastIndexOf("/") + 1);
const unread = () => state.activity.filter((a) => a.unread).length;
const $ = (s) => document.querySelector(s);
const hiddenFile = (fi) => state.fs[fi].collapsed || state.fs[fi].viewed;

/* ---------------------------------------------------------------------------
 * Rendering: rows, gaps, cards
 * ------------------------------------------------------------------------- */
const COMMENT_ICON = '<svg viewBox="0 0 16 16" width="10" height="10" aria-hidden="true"><path d="M2 2.5h12v8H8.2L5 13.3v-2.8H2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';
const DELIVERY = { sent: "Sent", seen: "Seen by Claude", replied: "Claude replied" };
const rangeLabel = (l) => (l[0] === l[1] ? `L${l[0]}` : `L${l[0]}–${l[1]}`);
const noted = (fi, ln) => state.notes.some((n) => n.file === fi && n.side === "new" && ln >= n.lines[0] && ln <= n.lines[1]);

function cellHtml(fi, i, side, word) {
  const f = state.files[fi], r = f.rows[i];
  const text = side === "old" ? r.o : r.n, ln = side === "old" ? r.ol : r.nl;
  if (text === null) return '<div class="num empty"></div><div class="code empty"></div>';
  const kind = changed(r) ? (side === "old" ? "del" : "add") : "";
  const novel = r.k === "same" ? [] : side === "old" ? r.oe : r.ne;
  const numCls = ["num", "side-" + side, kind, side === "new" && noted(fi, ln) && "noted", side === "new" && state.fs[fi].since.has(ln) && "since"].filter(Boolean).join(" ");
  return `<div class="${numCls}" data-n="${ln}" data-side="${side}"></div>` +
    `<div class="code" data-side="${side}">${lineHtml(text, f.lang, novel, side === "old" ? "nv-del" : "nv-add", word)}</div>`;
}

function rowHtml(fi, i) {
  const r = state.files[fi].rows[i];
  return `<div class="row" data-key="${fi}:${i}" data-f="${fi}" data-i="${i}" data-side="${r.n === null ? "old" : "new"}" data-ol="${r.ol ?? ""}" data-nl="${r.nl ?? ""}" data-chg="${changed(r) ? 1 : 0}">` +
    cellHtml(fi, i, "old") + cellHtml(fi, i, "new") + "</div>";
}

function msgHtml(m) {
  const you = m.who === "you";
  return `<div class="msg"><div class="av${you ? "" : " agent"}">${you ? "Y" : "✦"}</div>` +
    `<div class="msg-head"><b>${you ? "You" : "Claude"}</b><span class="when">${esc(m.at)}</span>` +
    (you && m.delivery ? `<span class="delivery" data-state="${m.delivery}">· ${DELIVERY[m.delivery]}</span>` : "") +
    `</div><p class="msg-body md">${m.html ?? esc(m.text)}</p></div>`;
}

function noteCard(n) {
  return `<div class="inline" data-side="${n.side}"><div class="card note" id="note-${n.id}">` +
    `<div class="card-top"><span class="kind" data-kind="${n.kind}">✦ ${n.kind}</span><span class="where">${rangeLabel(n.lines)}</span><span class="n">note ${state.notes.indexOf(n) + 1}/${state.notes.length}</span></div>` +
    msgHtml({ who: "agent", at: "9 min ago", html: n.body }) + (n.replies || []).map(msgHtml).join("") +
    `<div class="card-foot"><button class="link" type="button" data-reply="${n.id}">Reply</button><button class="link" type="button" data-tour="next">Next note <kbd>]a</kbd></button></div></div></div>`;
}

function threadCard(t) {
  return `<div class="inline" data-side="${t.side}"><div class="card${t.resolved ? " resolved" : ""}" id="thread-${t.id}" data-thread="${t.id}">` +
    (t.changedIn ? `<div class="changed-since">These lines changed in rev ${t.changedIn}, after your comment.</div>` : "") +
    `<div class="card-top"><span class="where">${t.side} ${rangeLabel(t.lines)}</span>${t.resolved ? '<span class="kind">resolved</span>' : ""}</div>` +
    t.msgs.map(msgHtml).join("") +
    `<div class="card-foot"><button class="link" type="button" data-reply="${t.id}">Reply <kbd>r</kbd></button><button class="link" type="button" data-resolve="${t.id}">${t.resolved ? "Unresolve" : "Resolve"} <kbd>x</kbd></button></div></div></div>`;
}

function inlinesAfter(fi, r) {
  const ends = (a) => a.file === fi && (a.side === "new" ? r.nl !== null && a.lines[1] === r.nl : r.ol !== null && a.lines[1] === r.ol);
  return state.notes.filter(ends).map(noteCard).join("") + state.threads.filter(ends).map(threadCard).join("");
}

function gapContext(f, from) {
  for (let i = Math.min(from, f.rows.length - 1); i >= 0; i--) {
    const t = f.rows[i].n ?? f.rows[i].o;
    if (/^\s{0,4}(?:pub )?(?:async )?(?:fn|struct|impl|enum)\b|^(?:export )?(?:function|const)\b/.test(t)) return t.trim();
  }
  return "";
}

function gapHtml(fi, a, b) {
  const f = state.files[fi], n = b - a + 1, top = a === 0, end = b === f.rows.length - 1;
  const btn = (dir, label) => `<button type="button" data-gap="${fi}:${a}:${b}:${dir}">${label}</button>`;
  let hidden = "";
  for (let k = a; k <= b; k++) hidden += rowHtml(fi, k);
  return `<div class="gap" data-gapctl="${fi}:${a}:${b}">` +
    (!top && n > STEP ? btn("down", `↓ ${STEP}`) : "") + btn("all", `${n} hidden line${n === 1 ? "" : "s"}`) + (!end && n > STEP ? btn("up", `↑ ${STEP}`) : "") +
    `<span class="ctx">${esc(end ? "" : gapContext(f, b + 1))}</span></div>` +
    `<div class="gap-body" hidden="until-found" data-gapbody="${fi}:${a}:${b}">${hidden}</div>`;
}

function rowsHtml(fi) {
  const f = state.files[fi], vis = state.fs[fi].visible;
  let html = "";
  for (let i = 0; i < f.rows.length; ) {
    if (vis[i]) { html += rowHtml(fi, i) + inlinesAfter(fi, f.rows[i]); i++; continue; }
    let j = i;
    while (j < f.rows.length && !vis[j]) j++;
    html += gapHtml(fi, i, j - 1);
    i = j;
  }
  return html;
}

function fileHtml(fi) {
  const f = state.files[fi], st = state.fs[fi], s = fileStats(f);
  const dir = f.path.includes("/") ? f.path.slice(0, f.path.lastIndexOf("/") + 1) : "";
  const hidden = st.collapsed || st.viewed;
  return `<section class="file${hidden ? " collapsed" : ""}" id="file-${fi}" data-f="${fi}">` +
    `<div class="file-head"><button class="fold" type="button" data-fold="${fi}" aria-label="${hidden ? "Expand" : "Collapse"} ${esc(f.path)}">▼</button>` +
    `<span class="st" data-s="${f.status}">${f.status}</span><span class="path"><span class="dir">${esc(dir)}</span>${esc(baseName(f.path))}</span>` +
    (f.collapsedBy ? `<span class="chip agent" title="Collapsed when Claude shared the review">✦ ${esc(f.collapsedBy.replace("Claude: ", ""))}</span>` : "") +
    `<span class="chip">${LANG_NAME[f.lang]}</span><span class="stats"><span class="a">+${s.add}</span><span class="d">−${s.del}</span></span>` +
    `<label class="viewed-box"><input type="checkbox" id="viewed-${fi}" data-viewed="${fi}"${st.viewed ? " checked" : ""}> Viewed</label></div>` +
    (hidden ? "" : `<div class="rows">${rowsHtml(fi)}</div>`) + "</section>";
}

/* File view (g enter): one file, no diff, slight marks in the gutter. */
function fileViewHtml(fi) {
  const f = state.files[fi];
  const side = f.status === "D" ? "old" : "new";
  let html = "", pendingDel = false;
  f.rows.forEach((r, i) => {
    const text = side === "old" ? r.o : r.n;
    if (text === null) { pendingDel = true; return; }
    const mark = side === "old" ? "" : r.k === "add" ? "add" : r.k === "chg" ? "mod" : pendingDel ? "del" : "";
    pendingDel = false;
    html += `<div class="row" data-key="${fi}:${i}" data-f="${fi}" data-i="${i}" data-side="${side}" data-ol="${r.ol ?? ""}" data-nl="${r.nl ?? ""}" data-chg="0">` +
      `<div class="mark ${mark}"></div><div class="num" data-n="${side === "old" ? r.ol : r.nl}" data-side="${side}"></div>` +
      `<div class="code" data-side="${side}">${lineHtml(text, f.lang, [], "", null)}</div></div>`;
  });
  return `<div class="fv-banner"><b>${esc(f.path)}</b><span>file at rev ${state.revision}, no diff</span><span class="grow"></span>` +
    `<span class="legend"><i style="background:var(--add-mark)"></i>added</span><span class="legend"><i style="background:var(--mod-mark)"></i>changed</span><span class="legend"><i style="background:var(--del-mark)"></i>removed</span>` +
    `<span><kbd>ctrl</kbd><kbd>o</kbd> back to the diff</span></div>` +
    `<section class="file fv"><div class="rows">${html}</div></section>`;
}

function renderBuffer() {
  const buf = $("#buffer");
  if (state.mode === "file") buf.innerHTML = fileViewHtml(state.fileView);
  else buf.innerHTML = `<div class="summary md"><b>✦ Claude</b> <span>${REVIEW.summary}</span> <button class="link" type="button" data-tour="start">Walk through ${state.notes.length} notes <kbd>]a</kbd></button></div>` +
    state.files.map((_, fi) => fileHtml(fi)).join("");
  afterRender();
}

/* Everything that changes the DOM goes through here, pinning the line at the top of the screen. */
function keepScroll(mutate) {
  const buf = $("#buffer");
  const top = topVisibleRow(), before = top?.getBoundingClientRect().top;
  const key = top?.dataset.key;
  mutate();
  const now = key && buf.querySelector(`.row[data-key="${key}"]`);
  if (now) buf.scrollTop += now.getBoundingClientRect().top - before;
  placePopover();
}
function rerenderFile(fi) {
  keepScroll(() => {
    const el = $("#file-" + fi);
    if (el && state.mode === "diff") el.outerHTML = fileHtml(fi);
    afterRender();
  });
}
function afterRender() {
  for (const el of document.querySelectorAll(".gap-body:not([data-bound])")) {
    el.dataset.bound = "1";
    el.addEventListener("beforematch", () => {
      const [fi, a, b] = el.dataset.gapbody.split(":").map(Number);
      for (let k = a; k <= b; k++) state.fs[fi].visible[k] = true;
      el.previousElementSibling?.remove();
    });
  }
  paintCursor();
  renderTree();
  renderActivity();
  renderStatus();
}

/* ---------------------------------------------------------------------------
 * Tree, activity, chat, status
 * ------------------------------------------------------------------------- */
const targetFile = (go) => go.file ?? go.show?.file ?? state.threads.find((t) => t.id === go.thread)?.file ?? state.notes.find((n) => n.id === go.note)?.file;

function diffBar(s) {
  const total = s.add + s.del || 1, a = Math.round((s.add / total) * 5);
  return `<span class="bar" title="+${s.add} −${s.del}">${[0, 1, 2, 3, 4].map((k) => `<i class="${k < a ? "a" : "d"}"></i>`).join("")}</span>`;
}

function treeHtml(node, prefix) {
  let html = "";
  for (const [name0, child0] of [...node.dirs].sort(([a], [b]) => a.localeCompare(b))) {
    let name = name0, child = child0;
    while (!child.files.length && child.dirs.size === 1) { const [n2, c2] = [...child.dirs][0]; name += "/" + n2; child = c2; }
    const key = prefix + name + "/", open = !state.closedDirs.has(key), inner = treeHtml(child, key);
    if (!inner) continue;
    html += `<li><div class="t-row t-dir" role="treeitem" data-dir="${esc(key)}" aria-expanded="${open}"><span class="chev">▼</span>${esc(name)}</div>${open ? `<ul>${inner}</ul>` : ""}</li>`;
  }
  for (const fi of node.files) {
    const f = state.files[fi];
    if (state.filter && !f.path.toLowerCase().includes(state.filter)) continue;
    const threads = state.threads.filter((t) => t.file === fi).length;
    const unreadHere = state.activity.some((a) => a.unread && targetFile(a.go) === fi);
    html += `<li><div class="t-row t-file${hiddenFile(fi) ? " dim" : ""}" role="treeitem" data-file="${fi}" aria-current="${state.currentFile === fi}" title="${esc(f.path)}${f.collapsedBy ? " · collapsed by Claude" : ""}">` +
      `<span class="st" data-s="${f.status}">${state.fs[fi].viewed ? "✓" : f.status}</span><span class="name">${esc(baseName(f.path))}</span>` +
      `<span class="t-meta">${unreadHere ? '<span class="dotu" title="Unread reply"></span>' : ""}${threads ? `<span class="c${unreadHere ? " unread" : ""}">${COMMENT_ICON}${threads}</span>` : ""}${diffBar(fileStats(f))}</span></div></li>`;
  }
  return html;
}

function renderTree() {
  const root = { dirs: new Map(), files: [] };
  state.files.forEach((f, fi) => {
    let node = root;
    for (const part of f.path.split("/").slice(0, -1)) {
      if (!node.dirs.has(part)) node.dirs.set(part, { dirs: new Map(), files: [] });
      node = node.dirs.get(part);
    }
    node.files.push(fi);
  });
  $("#tree-list").innerHTML = treeHtml(root, "") || '<li class="t-row" style="color:var(--subtle)">No files match</li>';
  $("#file-count").textContent = state.files.length;
}

function renderActivity() {
  $("#act-list").innerHTML = state.activity.map((a, i) =>
    `<li class="act${a.unread ? " unread" : ""}${a.fresh ? " enter" : ""}" data-act="${i}" tabindex="0"><span class="mk"></span><span class="what">${esc(a.what)}</span><span class="wh"><span>${esc(a.where)}</span><span>${esc(a.at)}</span></span></li>`).join("");
  for (const a of state.activity) a.fresh = false;
  const n = unread();
  $("#act-count").hidden = n === 0;
  $("#act-count").textContent = n;
  const h = $("#right-handle");
  h.innerHTML = n && $("#right").classList.contains("closed") ? '<span class="badge"></span>' : "";
  h.title = n ? `${n} unread in activity` : "";
}

function renderChat() {
  const log = $("#chat-log");
  log.hidden = state.chat.length === 0;
  log.innerHTML = state.chat.map((m) => `<div class="cm"><div class="av${m.who === "you" ? "" : " agent"}">${m.who === "you" ? "Y" : "✦"}</div><p class="md">${m.html ?? esc(m.text)}</p></div>`).join("");
  log.scrollTop = log.scrollHeight;
}

function hunkStarts() {
  const rows = navRows();
  return rows.filter((r, k) => r.dataset.chg === "1" && (k === 0 || rows[k - 1].dataset.chg !== "1" || rows[k - 1].dataset.f !== r.dataset.f));
}

function currentMode() {
  if (document.activeElement?.matches?.("#pop textarea, #chat-text")) return "INSERT";
  if (state.visual) return "VISUAL";
  if (state.cursor.word) return "SYMBOL";
  return state.mode === "file" ? "FILE" : "NORMAL";
}

function renderStatus() {
  const cur = cursorRow();
  let pos = "no cursor";
  if (cur) {
    const ln = (state.cursor.side === "old" ? cur.dataset.ol : cur.dataset.nl) || cur.dataset.nl || cur.dataset.ol;
    pos = `${baseName(state.files[+cur.dataset.f].path)}:${ln} ${state.cursor.side}`;
  }
  const hunks = hunkStarts();
  const at = cur ? hunks.filter((h) => h === cur || follows(h, cur)).length : 0;
  const mode = currentMode();
  const word = state.cursor.word ? ` · ${state.cursor.word.text}` : "";
  $("#status").innerHTML = `<span class="mode" data-mode="${mode}">${mode}</span><span>${esc(pos + word)}</span>` +
    (state.mode === "diff" ? `<span>hunk ${at}/${hunks.length}</span>` : "") +
    `<span>jumps ${state.jumpAt}/${state.jumps.length}</span><span class="pending">${esc([state.count, ...state.pending].join(" ").trim())}</span>` +
    `<span>rev ${state.revision} · live</span><span class="hints">${esc(state.message || hintFor(mode))}</span>`;
}
function hintFor(mode) {
  if (mode === "SYMBOL") return "w b next / previous symbol · gd or enter to definition · ctrl-o back · esc";
  if (mode === "FILE") return "ctrl-o back to the diff · gd definition · w symbol mode";
  if (mode === "VISUAL") return "j k extend · gc comment · esc";
  return "]c hunk · ]f file · ge expand · w symbols · gc comment · g enter file · ? keys";
}
let msgTimer = 0;
function say(m) { state.message = m; renderStatus(); clearTimeout(msgTimer); msgTimer = setTimeout(() => { state.message = ""; renderStatus(); }, 2800); }

/* ---------------------------------------------------------------------------
 * Cursor, word (symbol) cursor
 * ------------------------------------------------------------------------- */
const navRows = () => [...$("#buffer").querySelectorAll(".row")].filter((r) => !r.closest(".gap-body[hidden]"));
const cursorRow = () => (state.cursor.key ? $("#buffer").querySelector(`.row[data-key="${state.cursor.key}"]`) : null);
const follows = (a, b) => Boolean(a.compareDocumentPosition(b) & Node.DOCUMENT_POSITION_FOLLOWING);
function topVisibleRow() {
  const top = $("#buffer").getBoundingClientRect().top + 34;
  return navRows().find((r) => r.getBoundingClientRect().bottom > top) || null;
}
function redrawCell(row, side, word) {
  const cell = row?.querySelector(`.code[data-side="${side}"]`);
  if (!cell) return;
  const f = state.files[+row.dataset.f], r = f.rows[+row.dataset.i];
  const text = side === "old" ? r.o : r.n;
  const diff = state.mode === "diff";
  const novel = !diff || r.k === "same" ? [] : side === "old" ? r.oe : r.ne;
  cell.innerHTML = lineHtml(text, f.lang, novel, diff ? (side === "old" ? "nv-del" : "nv-add") : "", word);
}
let wordCell = null;
function paintCursor() {
  const buf = $("#buffer");
  for (const el of buf.querySelectorAll(".row.cur, .row.vsel, .code.caret")) el.classList.remove("cur", "vsel", "caret");
  if (wordCell) { const row = buf.querySelector(`.row[data-key="${wordCell.key}"]`); redrawCell(row, wordCell.side, null); wordCell = null; }
  const row = cursorRow();
  if (!row) return;
  row.classList.add("cur");
  (row.querySelector(`.code[data-side="${state.cursor.side}"]`) || row.querySelector(".code[data-side]"))?.classList.add("caret");
  if (state.cursor.word) { redrawCell(row, state.cursor.side, state.cursor.word.range); wordCell = { key: row.dataset.key, side: state.cursor.side }; }
  if (state.visual) {
    const rows = navRows(), a = rows.findIndex((r) => r.dataset.key === state.visual.anchor), b = rows.indexOf(row);
    if (a >= 0 && b >= 0) for (let k = Math.min(a, b); k <= Math.max(a, b); k++) if (rows[k].dataset.f === row.dataset.f) rows[k].classList.add("vsel");
  }
}
function setCursor(row, { side, scroll = "nearest", word = null } = {}) {
  if (!row) return;
  state.cursor.key = row.dataset.key;
  if (side) state.cursor.side = side;
  else if (!row.querySelector(`.code[data-side="${state.cursor.side}"]`)) state.cursor.side = row.dataset.side;
  state.cursor.word = word;
  if (state.currentFile !== +row.dataset.f) { state.currentFile = +row.dataset.f; renderTree(); }
  paintCursor();
  if (scroll) row.scrollIntoView({ block: scroll });
  renderStatus();
}
function lineTextAt(row, side) {
  const r = state.files[+row.dataset.f].rows[+row.dataset.i];
  return (side === "old" ? r.o : r.n) || "";
}
/* w / b: step through identifiers on the line; that's symbol mode. */
function stepWord(dir) {
  const row = cursorRow();
  if (!row) return;
  const words = [...lineTextAt(row, state.cursor.side).matchAll(IDENT)].map((m) => ({ text: m[0], range: [m.index, m.index + m[0].length] }));
  if (!words.length) return say("No symbols on this line");
  const at = state.cursor.word ? words.findIndex((w) => w.range[0] === state.cursor.word.range[0]) : -1;
  let next = at < 0 ? (dir > 0 ? 0 : words.length - 1) : at + dir;
  if (next < 0 || next >= words.length) { move(dir); next = null; }
  if (next === null) {

function openPicker(title, source) {
  state.picker = { source, sel: 0, items: [] };
  $("#picker-title").textContent = title;
  $("#picker-q").value = "";
  $("#picker").hidden = false;
  refreshPicker();
  $("#picker-q").focus();
}
function refreshPicker() {
  const q = $("#picker-q").value.trim().toLowerCase(), p = state.picker;
  p.items = p.source(q).filter((it) => it.literal || !q || fuzzy(q, (it.label + " " + it.sub).toLowerCase())).slice(0, 200);
  p.sel = Math.min(p.sel, Math.max(0, p.items.length - 1));
  $("#picker-list").innerHTML = p.items.map((it, i) => `<li data-pick="${i}" aria-selected="${i === p.sel}"><span>${esc(it.label)}</span><span class="sub">${esc(it.sub)}</span></li>`).join("") || '<li><span style="color:var(--subtle)">No matches</span></li>';
  $("#picker-list").querySelector('[aria-selected="true"]')?.scrollIntoView({ block: "nearest" });
}
function closePicker() { $("#picker").hidden = true; state.picker = null; $("#buffer").focus({ preventScroll: true }); }
function pick(i) { const it = state.picker?.items[i]; closePicker(); it?.run(); }

/* ---------------------------------------------------------------------------
 * Drawers: drag to resize, drag to the edge to leave only a handle
 * ------------------------------------------------------------------------- */
const drawers = { left: { w: 240, closed: false }, right: { w: 240, closed: false } };
function applyDrawers() {
  const main = $("#main");
  for (const side of ["left", "right"]) {
    const d = drawers[side];
    main.style.setProperty(side === "left" ? "--lw" : "--rw", d.closed ? "11px" : d.w + "px");
    $("#" + side).classList.toggle("closed", d.closed);
  }
  renderActivity();
  placePopover();
}
function toggleDrawer(side) { drawers[side].closed = !drawers[side].closed; applyDrawers(); }
for (const side of ["left", "right"]) {
  const h = $(`#${side}-handle`);
  h.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    h.setPointerCapture(e.pointerId);
    const main = $("#main").getBoundingClientRect(), d = drawers[side], startX = e.clientX;
    let moved = false;
    h.classList.add("dragging");
    const onMove = (ev) => {
      if (Math.abs(ev.clientX - startX) > 3) moved = true;
      if (!moved) return;
      const w = side === "left" ? ev.clientX - main.left : main.right - ev.clientX;
      d.closed = w < 110;
      if (!d.closed) d.w = Math.max(160, Math.min(480, w));
      applyDrawers();
    };
    const onUp = () => {
      h.classList.remove("dragging");
      h.removeEventListener("pointermove", onMove);
      h.removeEventListener("pointerup", onUp);
      if (!moved && d.closed) { d.closed = false; applyDrawers(); }
    };
    h.addEventListener("pointermove", onMove);
    h.addEventListener("pointerup", onUp);
  });
  h.addEventListener("dblclick", () => toggleDrawer(side));
  h.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleDrawer(side); }
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
      e.preventDefault();
      const grow = (e.key === "ArrowRight") === (side === "left");
      drawers[side].closed = false;
      drawers[side].w = Math.max(160, Math.min(480, drawers[side].w + (grow ? 16 : -16)));
      applyDrawers();
    }
  });
}

/* ---------------------------------------------------------------------------
 * Keymap: data, run by a small sequence engine (counts, modes, prefix timeout)
 * ------------------------------------------------------------------------- */
const KEYMAP = {
  "j": (n) => move(n), "k": (n) => move(-n), "down": (n) => move(n), "up": (n) => move(-n),
  "g g": () => { remember(); setCursor(navRows()[0], { scroll: "center" }); },
  "G": () => { remember(); setCursor(navRows().at(-1), { scroll: "center" }); },
  "ctrl-d": () => move(halfPage()), "ctrl-u": () => move(-halfPage()),
  "tab": () => switchSide(),
  "w": () => stepWord(1), "b": () => stepWord(-1),
  "] c": () => hunk(1), "[ c": () => hunk(-1), "] f": () => fileJump(1), "[ f": () => fileJump(-1),
  "] a": () => noteJump(1), "[ a": () => noteJump(-1), "] t": () => threadJump(1), "[ t": () => threadJump(-1),
  "] n": () => unreadJump(), "[ n": () => unreadJump(),
  "g e": () => expandNearest(), "shift-enter": () => expandNearest(),
  "z a": () => toggleFold(state.currentFile ?? 0),
  "z R": () => setAll((st) => { st.visible.fill(true); st.collapsed = false; }, "Showing every line"),
  "z M": () => setAll((st, fi) => { st.visible = initialVisible(state.files[fi], fi); st.collapsed = Boolean(state.files[fi].collapsedBy); }, "Back to hunks"),
  "g enter": () => openFileView(),
  "g d": () => gotoDefinition(), "ctrl-]": () => gotoDefinition(), "g r r": () => references(),
  "g s": () => outline(false), "g S": () => outline(true),
  "ctrl-o": () => jumpBack(), "ctrl-i": () => jumpForward(),
  "/": () => searchPicker(),
  "V": () => startVisual(), "v": () => startVisual(),
  "g c c": () => commentLines(), "g c": () => (state.selection ? commentSelection() : commentLines()),
  "r": () => { const c = nearThread(); c ? openComposer({ replyTo: c.dataset.thread }) : say("No thread to reply to"); },
  "x": () => { const c = nearThread(); if (c) toggleResolved(c.dataset.thread); },
  "space e": () => toggleDrawer("left"), "space n": () => toggleDrawer("right"),
  "space f": () => filePicker(), "ctrl-p": () => filePicker(),
  "space i": () => $("#chat-text").focus(),
  "space v": () => { const fi = state.currentFile ?? 0; setViewed(fi, !state.fs[fi].viewed); if (state.fs[fi].viewed) fileJump(1); },
  "?": () => ($("#help").hidden = false),
  "esc": () => escapeAll(),
};
const SYMBOL_KEYMAP = { "enter": () => gotoDefinition() };
const VISUAL_KEYMAP = { "g c": () => commentLines(), "c": () => commentLines() };

const HELP = [
  ["Move", [["j k", "Line down / up (5j works)"], ["gg G", "First / last line"], ["ctrl-d ctrl-u", "Half a page"], ["tab", "Switch old / new side"], ["ctrl-o ctrl-i", "Jump back / forward"]]],
  ["Symbols", [["w b", "Next / previous symbol on the line"], ["gd enter", "Go to definition (or ctrl-click)"], ["grr", "Find references"], ["gs gS", "Symbols in file / in diff"]]],
  ["Review", [["]c [c", "Next / previous hunk"], ["]f [f", "Next / previous file, skipping collapsed ones"], ["]a [a", "Claude's notes, in order"], ["]t [t", "Next / previous thread"], ["]n", "Next unread activity"], ["space v", "Mark viewed, go to next file"]]],
  ["Context", [["g e", "Expand the nearest collapsed region, toward the cursor"], ["za", "Collapse / expand file"], ["zR zM", "Everything / back to hunks"], ["g enter", "The plain file here, no diff"]]],
  ["Talk", [["gcc", "Comment on this line"], ["V … gc", "Comment on selected lines"], ["gc", "Comment on a mouse selection"], ["r x", "Reply / resolve next thread"], ["space i", "Ask Claude anything"]]],
  ["Panels", [["space e", "Files drawer"], ["space n", "Activity drawer"], ["space f ctrl-p", "Go to file"], ["/", "Search every line"], ["ctrl-f", "Browser find, never intercepted"]]],
];
$("#keys").innerHTML = HELP.map(([g, rows]) => `<h3>${g}</h3>` + rows.map(([k, d]) =>
  `<div><span>${esc(d)}</span><span>${k.split(" ").map((x) => (x === "…" ? "…" : `<kbd>${esc(x)}</kbd>`)).join(" ")}</span></div>`).join("")).join("");

function switchSide() {
  const row = cursorRow(), other = state.cursor.side === "new" ? "old" : "new";
  if (state.mode !== "diff") return;
  if (row?.querySelector(`.code[data-side="${other}"]`)) { state.cursor.side = other; state.cursor.word = null; paintCursor(); renderStatus(); }
  else say(`This line has no ${other} side`);
}
function startVisual() { const cur = cursorRow(); if (!cur) return; state.visual = { anchor: cur.dataset.key }; state.cursor.word = null; paintCursor(); }
function escapeAll() {
  if (!$("#help").hidden) { $("#help").hidden = true; return; }
  if (state.nudge) return nudgeDone(false);
  if (state.composer) return closeComposer();
  if (state.visual) { state.visual = null; return paintCursor(); }
  if (state.cursor.word) { state.cursor.word = null; return paintCursor(); }
  getSelection().removeAllRanges();
}
function keyToken(e) {
  if (e.key === " ") return "space";
  if (e.key === "Enter") return e.shiftKey ? "shift-enter" : "enter";
  if (e.key === "Escape") return "esc";
  if (e.key === "Tab") return e.shiftKey ? null : "tab";
  if (e.key === "ArrowDown") return "down";
  if (e.key === "ArrowUp") return "up";
  if (e.metaKey || e.altKey) return null;
  if (e.ctrlKey) return e.key.length === 1 ? "ctrl-" + e.key.toLowerCase() : null;
  return e.key.length === 1 ? e.key : null;
}
let pendingTimer = 0;
document.addEventListener("keydown", (e) => {
  if (e.key === "Control" || e.key === "Meta") document.body.classList.add("sym");
  const t = e.target;
  if (t.id === "pop-text") {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sendComposer(); }
    else if (e.key === "Escape") { e.preventDefault(); closeComposer(); }
    return;
  }
  if (t.id === "chat-text") { if (e.key === "Escape") { t.blur(); $("#buffer").focus({ preventScroll: true }); renderStatus(); } return; }
  if (t.id === "picker-q") {
    const p = state.picker;
    if (e.key === "Escape") { e.preventDefault(); closePicker(); }
    else if (e.key === "Enter") { e.preventDefault(); pick(p.sel); }
    else if (e.key === "ArrowDown" || (e.ctrlKey && e.key === "n")) { e.preventDefault(); p.sel = Math.min(p.items.length - 1, p.sel + 1); refreshPicker(); }
    else if (e.key === "ArrowUp" || (e.ctrlKey && e.key === "p")) { e.preventDefault(); p.sel = Math.max(0, p.sel - 1); refreshPicker(); }
    return;
  }
  if (t.matches?.("input, textarea")) return;
  if (!$("#help").hidden) { if (e.key === "Escape" || e.key === "?") { e.preventDefault(); escapeAll(); } return; }
  if (state.nudge && (e.key === "Enter" || e.key === "Escape")) { e.preventDefault(); return nudgeDone(e.key === "Enter"); }

  const tok = keyToken(e);
  if (!tok) return;
  if (!state.pending.length && (/^[1-9]$/.test(tok) || (state.count && /^\d$/.test(tok)))) { e.preventDefault(); state.count += tok; return renderStatus(); }
  const map = { ...KEYMAP, ...(state.cursor.word ? SYMBOL_KEYMAP : {}), ...(state.visual ? VISUAL_KEYMAP : {}) };
  const seq = [...state.pending, tok].join(" ");
  clearTimeout(pendingTimer);
  const exact = map[seq], longer = Object.keys(map).some((k) => k.startsWith(seq + " "));
  if (exact && !(longer && seq === "g c" && !state.selection && !state.visual)) {
    e.preventDefault();
    const n = Math.max(1, +state.count || 1);
    state.pending = []; state.count = "";
    exact(n);
    return renderStatus();
  }
  if (longer) {
    e.preventDefault();
    state.pending.push(tok);
    pendingTimer = setTimeout(() => { state.pending = []; renderStatus(); }, 1200);
    return renderStatus();
  }
  state.pending = []; state.count = "";
  if (map[tok]) { e.preventDefault(); map[tok](1); }
  renderStatus();
});
document.addEventListener("keyup", (e) => { if (e.key === "Control" || e.key === "Meta") document.body.classList.remove("sym"); });
window.addEventListener("blur", () => document.body.classList.remove("sym"));

/* ---------------------------------------------------------------------------
 * Mouse
 * ------------------------------------------------------------------------- */
document.addEventListener("mousedown", (e) => { if (e.target.closest("#bubble")) e.preventDefault(); });
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-gap],[data-fold],[data-reply],[data-resolve],[data-tour],[data-send],[data-cancel],[data-close],[data-nudge],[data-pick],[data-go],.t-dir,.t-file,.act,.num[data-n],.code[data-side],#bubble-btn");
  if (!el) return;
  const d = el.dataset;
  if (el.id === "bubble-btn") return commentSelection();
  if (d.gap) return expandGap(d.gap);
  if (d.fold !== undefined) return toggleFold(+d.fold);
  if (d.reply) return openComposer({ replyTo: d.reply });
  if (d.resolve) return toggleResolved(d.resolve);
  if (d.tour) { if (d.tour === "start") state.noteIdx = -1; return noteJump(1); }
  if (d.send !== undefined) return sendComposer();
  if (d.cancel !== undefined) return closeComposer();
  if (d.close !== undefined) return escapeAll();
  if (d.nudge) return nudgeDone(d.nudge === "go");
  if (d.pick !== undefined) return pick(+d.pick);
  if (d.go) { const [fi, side, line] = d.go.split(":"); return goTo(+fi, side, +line); }
  if (d.dir) { state.closedDirs.has(d.dir) ? state.closedDirs.delete(d.dir) : state.closedDirs.add(d.dir); return renderTree(); }
  if (d.file !== undefined) return openFile(+d.file);
  if (d.act !== undefined) return activityGo(+d.act);
  const row = el.closest(".row");
  if (!row) return;
  if (el.classList.contains("num") && state.mode === "diff") {
    const side = d.side, key = side === "old" ? "ol" : "nl", line = +d.n, fi = +row.dataset.f, cur = cursorRow();
    if (e.shiftKey && cur && +cur.dataset.f === fi && cur.dataset[key]) {
      const lines = [Math.min(line, +cur.dataset[key]), Math.max(line, +cur.dataset[key])];
      return openComposer({ file: fi, side, lines, quote: lineText(fi, side, lines) });
    }
    setCursor(row, { side, scroll: false });
    return openComposer({ file: fi, side, lines: [line, line], quote: lineText(fi, side, [line, line]) });
  }
  if (!getSelection().isCollapsed) return;
  const ref = e.target.closest(".ref");
  const side = d.side;
  let word = null;
  if (ref) {
    const range = document.createRange();
    range.setStart(el, 0); range.setEndBefore(ref);
    const at = range.toString().length;
    word = { text: ref.textContent, range: [at, at + ref.textContent.length] };
  }
  setCursor(row, { side, scroll: false, word });
  if (word && (e.ctrlKey || e.metaKey)) gotoDefinition(word.text);
});
document.addEventListener("change", (e) => { if (e.target.dataset.viewed !== undefined) setViewed(+e.target.dataset.viewed, e.target.checked); });
document.addEventListener("selectionchange", () => requestAnimationFrame(updateBubble));
$("#picker-q").addEventListener("input", () => { state.picker.sel = 0; refreshPicker(); });
$("#filter").addEventListener("input", (e) => { state.filter = e.target.value.trim().toLowerCase(); renderTree(); });
$("#chat-form").addEventListener("submit", (e) => { e.preventDefault(); const t = $("#chat-text").value.trim(); if (t) { $("#chat-text").value = ""; sendChat(t); } });
$("#chat-text").addEventListener("focus", renderStatus);
$("#play-edit").addEventListener("click", playEdit);
$("#play-show").addEventListener("click", playShow);
$("#reset").addEventListener("click", init);
for (const ov of document.querySelectorAll(".overlay")) ov.addEventListener("click", (e) => { if (e.target === ov) (ov.id === "picker" ? closePicker : escapeAll)(); });
let frame = 0;
$("#buffer").addEventListener("scroll", () => {
  placePopover();
  if (frame) return;
  frame = requestAnimationFrame(() => {
    frame = 0;
    if (state.selection) updateBubble();
    if (state.mode !== "diff") return;
    const top = $("#buffer").getBoundingClientRect().top + 40;
    let cur = 0;
    for (const sec of document.querySelectorAll(".file[data-f]")) if (sec.getBoundingClientRect().top <= top) cur = +sec.dataset.f;
    if (cur !== state.currentFile) { state.currentFile = cur; for (const el of document.querySelectorAll(".t-file")) el.setAttribute("aria-current", String(+el.dataset.file === cur)); }
  });
}, { passive: true });
window.addEventListener("resize", placePopover);

function init() {
  initState();
  drawers.left.closed = innerWidth < 760;
  drawers.right.closed = innerWidth < 1180;
  for (const id of ["help", "picker", "nudge", "bubble", "pop"]) $("#" + id).hidden = true;
  setPresence("listening");
  renderHeader();
  applyDrawers();
  renderChat();
  renderBuffer();
  $("#buffer").scrollTop = 0;
  const first = hunkStarts()[0];
  if (first) setCursor(first, { scroll: false });
}
init();
</script>
