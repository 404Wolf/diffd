[workspace]
resolver = "3"
members = ["crates/*"]
# Vendored dependencies are patched in below, not workspace members.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/404Wolf/diffd"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
diffd-core = { path = "crates/diffd-core" }
diffd-server = { path = "crates/diffd-server" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "11", features = ["serde-json-impl", "no-serde-warnings"] }
schemars = "1"
utoipa = { version = "6", features = ["preserve_order"] }
rayon = "1"
similar = "2"
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"
tree-sitter-tags = "0.25"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
insta = { version = "1", features = ["json"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[patch.crates-io]
# Signal's fork of tungstenite, with permessage-deflate (see vendor/tungstenite/VENDORED.md).
tungstenite = { path = "vendor/tungstenite" }
